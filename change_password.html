<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="asset/css/styles.css" />
</head>

<body>
    <main class="login-page">
        <section class="login-card">
            <header class="login-header">
                <div class="brand-badge" aria-hidden="true">🔒</div>
                <h1>Nueva Contraseña</h1>
                <p class="subtitle">Ingresa el código que recibiste y tu nueva contraseña</p>
            </header>

            <form id="changePasswordForm" class="login-form">
                <div class="form-group">
                    <label for="token">Código de recuperación (Simulado: 123456)</label>
                    <input type="text" id="token" name="token" required placeholder="Ej: 123456" />
                </div>

                <div class="form-group">
                    <label for="new_password">Nueva Contraseña</label>
                    <input type="password" id="new_password" name="new_password" required />
                </div>

                <button type="submit" class="btn-primary">
                    <span class="btn-text">Cambiar Contraseña</span>
                </button>

                <p id="formMessage" class="form-message"></p>
            </form>

            <footer class="login-footer">
                <p><a href="index.html" class="link">Volver al inicio de sesión</a></p>
            </footer>
        </section>
    </main>

    <script src="asset/js/change_password.js"></script>
</body>

</html>
